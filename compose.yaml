services:
  infinitejudge:
    build:
      context: .
      dockerfile: Dockerfile
    image: infinitejudge:local
    container_name: infinitejudge
    restart: unless-stopped
    init: true
    ports:
      - "${IJ_BIND_ADDRESS:-0.0.0.0}:${IJ_PORT:-4001}:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      DB_PATH: /app/data/infinte.db
      IJ_LICENSE_KEY: ${IJ_LICENSE_KEY:-}
      IJ_LICENSE_SERVER_URL: ${IJ_LICENSE_SERVER_URL:-https://key.brightweb.top}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
